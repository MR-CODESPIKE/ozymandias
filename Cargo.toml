[package]
name = "ozymandias"
version = "0.1.0"
edition = "2021"
authors = ["Manus AI"]
description = "A bounded, auditable Rust-native autonomous agent runtime"
license = "MIT"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
async-openai = "0.18"
bollard = "0.15"
headless_chrome = "1.0.9"
qdrant-client = "1.7"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
real-browser = []
real-qdrant = []

[[bin]]
name = "ozymandias"
path = "src/main.rs"
